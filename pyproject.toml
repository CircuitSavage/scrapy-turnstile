[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scrapy-turnstile"
version = "0.1.0"
description = "Scrapy downloader middleware that solves Cloudflare Turnstile automatically via the Peak API."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Peak" }]
keywords = [
  "scrapy",
  "cloudflare",
  "turnstile",
  "captcha",
  "solver",
  "bypass",
  "middleware",
]
classifiers = [
  "Framework :: Scrapy",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.optional-dependencies]
scrapy = ["scrapy>=2.0"]

[project.urls]
Source = "https://github.com/CircuitSavage/scrapy-turnstile"
Homepage = "https://peak.fo/?utm_source=github&utm_medium=readme&utm_campaign=packages&utm_content=scrapy-turnstile"
Documentation = "https://peak.fo/docs/turnstile?utm_source=github&utm_medium=pypi&utm_campaign=packages&utm_content=scrapy-turnstile"

[tool.hatch.build.targets.wheel]
packages = ["scrapy_turnstile"]

[tool.hatch.build.targets.sdist]
include = [
  "scrapy_turnstile",
  "examples",
  "tests",
  "assets",
  "README.md",
  "LICENSE",
  "TEST.md",
]
